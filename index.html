<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Backlot</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f3f2ee" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Backlot" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='6' fill='%230e1412'/%3E%3Cpath d='M17 8.5 25 23.5H17' stroke='%23c9a45a' stroke-width='1.6' fill='none' opacity='.7'/%3E%3Crect x='3.5' y='4.5' width='13.5' height='19' stroke='%23c9a45a' stroke-width='1.8' fill='none'/%3E%3Crect x='7.6' y='9' width='5.300' height='6.200' fill='%23c9a45a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500;1,6..96,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" />
    <style>
      /* The opening screen. Plain HTML, so it shows before any script arrives; the app
         lifts it the moment the first screen is ready. It never adds waiting time. */
      #bl-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #f3f2ee; color: #111716; transition: opacity .32s ease, visibility .32s; font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif; }
      #bl-splash[data-theme='night'] { background: #0e1412; color: #ece7db; }
      #bl-splash.gone { opacity: 0; visibility: hidden; transform: scale(1.03); transition: opacity .42s cubic-bezier(.4,0,1,1), transform .42s cubic-bezier(.4,0,1,1), visibility .42s; }
      #bl-splash .bl-s-in { transition: transform .42s cubic-bezier(.4,0,1,1); }
      #bl-splash.gone .beam { opacity: .9; transform: scaleX(1.25); transition: opacity .3s, transform .42s; }
      #bl-splash .bl-s-in { display: grid; justify-items: center; gap: 14px; padding: 0 24px; text-align: center; }
      #bl-splash svg { width: 72px; height: 72px; overflow: visible; }
      #bl-splash .door { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-dasharray: 70; stroke-dashoffset: 70; animation: bl-s-draw .7s cubic-bezier(.2,.7,.2,1) forwards; }
      #bl-splash .beam { fill: #3fd0c1; opacity: 0; transform-origin: 17px 14px; transform: scaleX(.2); animation: bl-s-beam .9s .45s cubic-bezier(.2,.7,.2,1) forwards; }
      #bl-splash .pane { fill: #3fd0c1; opacity: 0; animation: bl-s-fade .4s .55s ease forwards; }
      #bl-splash[data-theme='night'] .beam, #bl-splash[data-theme='night'] .pane { fill: #c9a45a; }
      #bl-splash .word { font-family: 'Bodoni Moda', Didot, 'Times New Roman', serif; font-size: 30px; letter-spacing: .01em; opacity: 0; animation: bl-s-fade .5s .35s ease forwards; }
      #bl-splash .line { min-height: 4.2em; max-width: 320px; margin: 0; font-size: 13px; line-height: 1.4; color: #4f5755; }
      #bl-splash .line span { display: block; opacity: 0; transform: translateY(4px); animation: bl-s-up .4s cubic-bezier(0,0,.2,1) forwards; }
      #bl-splash .line span:nth-child(1) { animation-delay: .75s; }
      #bl-splash .line span:nth-child(2) { animation-delay: 1.2s; }
      #bl-splash .line span:nth-child(3) { animation-delay: 1.65s; }
      #bl-splash .skip { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; color: #636b69; opacity: 0; animation: bl-s-fade .4s 1.4s ease forwards; }
      #bl-splash[data-theme='night'] .skip { color: #8d978f; }
      @keyframes bl-s-up { to { opacity: 1; transform: none; } }
      #bl-splash[data-theme='night'] .line { color: #aab2a9; }
      #bl-splash .line b { font-weight: 600; color: inherit; }
      @keyframes bl-s-draw { to { stroke-dashoffset: 0; } }
      @keyframes bl-s-beam { to { opacity: .35; transform: none; } }
      @keyframes bl-s-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #bl-splash .door, #bl-splash .beam, #bl-splash .pane, #bl-splash .word, #bl-splash .line span, #bl-splash .skip { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
        #bl-splash.gone, #bl-splash.gone .beam { transform: none; }
        #bl-splash .beam { opacity: .35; }
      }
    </style>
  </head>
  <body>
    <div id="bl-splash" aria-hidden="true">
      <div class="bl-s-in">
        <svg viewBox="0 0 28 28"><path class="beam" d="M17 8.5 25 23.5H17Z" /><rect class="door" x="3.5" y="4.5" width="13.5" height="19" /><rect class="pane" x="7.6" y="9" width="5.3" height="6.2" /></svg>
        <div class="word">Backlot</div>
        <p class="line" id="bl-splash-line"></p>
      </div>
      <p class="skip" id="bl-splash-skip" hidden>Tap to skip</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
