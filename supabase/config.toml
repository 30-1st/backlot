# Both functions authorize callers in their own code, so the platform's
# built-in JWT check is off for them. See each function's header comment.

[functions.signup]
verify_jwt = false

[functions.purge-inactive]
verify_jwt = false

# Admin-only setup check. Platform JWT check stays on, and the function also
# demands the admin token (see its header comment).
[functions.agent-check]
verify_jwt = true

[functions.algo-ingest]
# GitHub Actions identity tokens are not Supabase logins; the function verifies them itself.
verify_jwt = false

[functions.rein]
# Called only by Backlot's server code with a server key (not a JWT); the function checks the key itself.
verify_jwt = false

[functions.bil]
# The app's door to Bil. Off so the browser's CORS preflight (no login) can be answered;
# the function verifies the login itself on every POST.
verify_jwt = false

[functions.bil-worker]
# Called by pg_cron and the bil function with the worker token from internal_config.
verify_jwt = false

[functions.team]
# The team's door (who you are, people, invites, passwords). Off so the browser's CORS
# preflight can be answered; the function verifies the login itself on every POST.
verify_jwt = false

[functions.room]
# The public door for client rooms (K1). Visitors have no Backlot login, so the function
# checks everything itself: the rooms site's address, preview tickets, the bot check and
# limits. It returns only what a room shows.
verify_jwt = false
