# Keeps Backlot's index of X's open-source ranking code (xai-org/x-algorithm) current.
# See scripts/algorithm_index/index.py for what it does.
#
# Daily at 09:13 UTC: off the top of the hour, when GitHub delays scheduled runs, and after
# X's usual daily snapshot. Also runs by hand, and on pushes that change the job itself.
# It authenticates to Supabase with GitHub's own identity token; no secrets are stored.

name: Algorithm index

on:
  schedule:
    - cron: "13 9 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/algorithm_index/**"
      - ".github/workflows/algorithm-index.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: algorithm-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INGEST_URL: https://hfmszquugwbfxsndpcao.supabase.co/functions/v1/algo-ingest
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/algorithm_index/requirements.txt

      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-gte-small-${{ hashFiles('scripts/algorithm_index/requirements.txt') }}

      - name: Install
        run: pip install -r scripts/algorithm_index/requirements.txt

      - name: Get the latest x-algorithm snapshot
        run: git clone --depth 1 https://github.com/xai-org/x-algorithm "$RUNNER_TEMP/x-algorithm"

      - name: Index
        run: python scripts/algorithm_index/index.py --repo "$RUNNER_TEMP/x-algorithm"
