# Deploys Backlot's Supabase Edge Functions whenever their code changes on main.
#
# The Supabase CLI bundles each function on Supabase's side (--use-api, no Docker) and
# reads verify_jwt for each function from supabase/config.toml, so what runs is exactly
# what is in the repo. Also runs by hand from the Actions tab.
#
# Needs one repository secret, SUPABASE_ACCESS_TOKEN: a personal access token made in
# the Supabase dashboard (Account, Access Tokens) and pasted into GitHub (Settings,
# Secrets and variables, Actions). It never appears in the repo or in logs. Without it,
# the job stops early and says so.

name: Deploy functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hfmszquugwbfxsndpcao
    steps:
      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first (see the top of this file)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Deploy every function
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api

      - name: List what is live
        run: supabase functions list --project-ref "$PROJECT_REF"
